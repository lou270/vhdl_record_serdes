[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vhdl-record-serdes"
version = "1.0.0"
description = "Generate VHDL record serialization / deserialization functions"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
vhdl-record-serdes = "vhdl_record_serdes.cli:main"

[tool.setuptools]
packages = ["vhdl_record_serdes"]
